<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="">
</head>

<body>
    <header>
        <div class="caixa">
            <h1><img src="logo.png"></h1>

            <nav>
                <ul>
                    <li><a href="produtos.html">Produtos</a></li>
                    <li><a href="contatos.html">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <form>
            <fieldset>
                <p>Nome e sobrenome</p>
                <input type="text" class="input-texto" required>

                <p>E-mail :</p>
                <input type="text" class="input-texto" required placeholder="@login.com">

                <p> Telefone</p>
                <input type="text" class="input-texto" required placeholder="(99) 9 9990-9999">
                <p> Mensagem</p>
                <textarea cols="70" rows="10" required> </textarea>
            </fieldset>

            <fieldset>
                <legend>
                    Como prefere o nosso contato?
                </legend>
                <input type="radio" name="contato" value="Telefone">

                <input type="radio" name="contato" value="whatsapp" checked>
            </fieldset>

            <fieldset>
                <legend> Como prefere o nosso contato?</legend>
                <p><input type="radio" name="contato" value="E-mail"> E-mail</p>
                <p><input type="radio" name="contato" value="Telefone"> Telefone</p>
                <p><input type="radio" name="contato" value="E-mail"> whatsapp</p>
            </fieldset>

            <fieldset>
                <legend>Qual horario prefere ser atendido?</legend>
                <select>
                    <option>Manhã</option>
                    <option>tarde</option>
                    <option>Noite</option>
                </select>
            </fieldset>

            <p>
                <input type="checkbox" checked>Gostaria de receber nosas novidades por E-mail?
            </p>

            <button class="enviar"> Enviar Formulario </button>
        </form>

    </main>
    <footer>
        <img src="logo-branco.png" alt="">
        <p class="copy right"></p>
    </footer>


</body>

</html>
